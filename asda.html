<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Showcase Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<section class="max-w-9xl mx-auto px-4 py-16">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4" >

    <!-- CARD 1 -->
    <div class="rounded-2xl overflow-hidden bg-gradient-to-br from-indigo-600 to-blue-500" style="background-image: url(https://webmobtechcdn.nyc3.cdn.digitaloceanspaces.com/wmt_v4/2020/10/houzquest-portfolio.webp);">
      <div class="grid grid-cols-1 md:grid-cols-2 items-center h-full">

        <!-- LEFT CONTENT -->
        <div class="p-8 text-white space-y-6">
          <h2 class="text-3xl lg:text-4xl font-bold leading-tight">
            MLS & Listing<br />Management
          </h2>

          <p class="text-indigo-100">
            MLS Real Estate Solutions & Listing Management
          </p>

          <!-- TAGS -->
          <div class="flex flex-wrap gap-3">
            <span class="px-4 py-2 text-sm rounded-lg bg-white/20">Manage Listing</span>
            <span class="px-4 py-2 text-sm rounded-lg bg-white/20">MLS Integration</span>
            <span class="px-4 py-2 text-sm rounded-lg bg-white/20">Real Estate</span>
          </div>

          <!-- ARROW -->
          <a href="#" class="inline-flex mt-4 p-3 rounded-lg bg-white/20 hover:bg-white/30 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 8l4 4m0 0l-4 4m4-4H3" />
            </svg>
          </a>
        </div>

        <!-- RIGHT IMAGE (IMG ONLY) -->
        <div class="flex justify-center md:justify-end p-6">
          <img
            src="YOUR_MLS_IMAGE.png"
            alt="MLS App"
            class="max-h-[320px] w-auto rounded-xl shadow-2xl"
          />
        </div>
      </div>
    </div>

    <!-- CARD 2 -->
    <div class="rounded-2xl overflow-hidden bg-gradient-to-br from-purple-600 to-pink-500">
      <div class="grid grid-cols-1 md:grid-cols-2 items-center h-full">

        <!-- LEFT CONTENT -->
        <div class="p-8 text-white space-y-6">
          <h2 class="text-3xl lg:text-4xl font-bold">
            QuestnQuiz
          </h2>

          <p class="text-purple-100">
            QuestnQuiz Maker / Generator App
          </p>

          <!-- TAGS -->
          <div class="flex flex-wrap gap-3">
            <span class="px-4 py-2 text-sm rounded-lg bg-white/20">Learn & Grow</span>
            <span class="px-4 py-2 text-sm rounded-lg bg-white/20">QuestnQuiz App</span>
            <span class="px-4 py-2 text-sm rounded-lg bg-white/20">Scan and Make</span>
          </div>

          <!-- ICONS -->
          <div class="flex gap-4 pt-2">
            <span class="p-3 rounded-lg bg-white/20"></span>
            <span class="p-3 rounded-lg bg-white/20">▶</span>
            <span class="p-3 rounded-lg bg-white/20">🌐</span>
            <span class="p-3 rounded-lg bg-white/20">→</span>
          </div>
        </div>

        <!-- RIGHT IMAGE (IMG ONLY) -->
        <div class="flex justify-center md:justify-end p-6">
          <img
            src="YOUR_QUESTNQUIZ_IMAGE.png"
            alt="QuestnQuiz App"
            class="max-h-[360px] w-auto rounded-xl shadow-2xl"
          />
        </div>
      </div>
    </div>

  </div>
</section>

</body>
</html>
